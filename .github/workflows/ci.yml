name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git describe 需要完整历史

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true # caches both GOMODCACHE and GOCACHE

      - name: Download dependencies
        run: go mod download

      # embed.go (non-dev) requires internal/api/web/dist to exist.
      # See Makefile `build-web`. CI uses a placeholder; real prod release
      # copies web/dist there via `make build`.
      - name: Stub web/dist for embed
        run: mkdir -p internal/api/web/dist && echo '<html></html>' > internal/api/web/dist/index.html

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          # 固定版本保证 CI 可复现（官方建议），避免上游升版导致全库突然全红。
          # goimports 已作为 formatter 配置在 .golangci.yml，由本 step 统一检查。
          version: v2.12.2

      - name: Test
        run: go test -race ./...

      - name: Build (production, CGO disabled)
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=0 go build -ldflags "-X easyserver/internal/infra/version.Version=${VERSION}" -o easyserver ./cmd/server

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        # pnpm build = `tsc --noEmit && vite build`，tsc 部分已在 Type check step 跑过，
        # 这里只做打包，避免重复类型检查拖慢 CI。
        run: pnpm exec vite build
