name: Release Please

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # 当 Release PR 被合并、Release 被创建时触发打包并上传资产
      - name: Checkout repository
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.releases_created }}
        with:
          version: latest

      - name: Set up Node.js
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          cd web
          pnpm install
          pnpm build
          mkdir -p ../internal/api/web/dist
          cp -a dist/. ../internal/api/web/dist/

      - name: Build linux-amd64
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          VERSION=${{ steps.release.outputs.tag_name }}
          LDFLAGS="-X easyserver/internal/infra/version.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o easyserver-linux-amd64 ./cmd/server

      - name: Build linux-arm64
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          VERSION=${{ steps.release.outputs.tag_name }}
          LDFLAGS="-X easyserver/internal/infra/version.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o easyserver-linux-arm64 ./cmd/server

      - name: Smoke test (amd64)
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          cat > /tmp/easyserver-test.toml << 'TEST_CONFIG'
          [server]
          port = 18080
          host = "127.0.0.1"

          [auth]
          jwt_secret = "ci-smoke-test-jwt-secret-at-least-32-bytes-long!!"

          [filemanager]
          base_path = "/tmp/easyserver-data"
          TEST_CONFIG
          chmod +x easyserver-linux-amd64
          MISE_DATA_DIR=/tmp/mise-data ./easyserver-linux-amd64 -config /tmp/easyserver-test.toml &
          PID=$!
          # 轮询等待监听，最多 15s
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:18080/health >/dev/null 2>&1 && { echo "Smoke test PASSED"; break; }
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID"; RC=$?
              echo "Smoke test FAILED — binary exited early with code $RC"; exit 1
            fi
            sleep 1
            [ "$i" = 15 ] && { echo "Smoke test FAILED — did not listen within 15s"; exit 1; }
          done
          kill "$PID" 2>/dev/null || true

      - name: Calculate checksums
        if: ${{ steps.release.outputs.releases_created }}
        run: sha256sum easyserver-linux-amd64 easyserver-linux-arm64 > checksums-sha256.txt

      - name: Upload Release Assets
        if: ${{ steps.release.outputs.releases_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            ./easyserver-linux-amd64 \
            ./easyserver-linux-arm64 \
            ./checksums-sha256.txt \
            --clobber
