# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "zh-CN"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"
      - "main"
  path_filters:
    - "!web/dist/**"
    - "!internal/api/web/dist/**"
    - "!**/node_modules/**"
    - "!**/*.sum"
    - "!**/pnpm-lock.yaml"
    - "!migrations/**"
    - "!**/*.min.*"
    - "!**/*.map"
    - "!**/*.example"
    - "!scripts/**"
  path_instructions:
    - path: "{cmd,internal}/**/*.go"
      instructions: |
        Go 后端代码审查重点：
        1. 安全与输入校验：严格校验用户输入的路径、参数、版本、域名，严防路径穿越（Path Traversal / ZipSlip）、命令注入与 SQL 注入。
        2. 项目契约规范：
           - 面板根目录严禁硬编码字面量，一律使用 `config.DataRoot` 派生。
           - 配置权威：动态配置通过 `config.Store` 获取最新快照，避免脏读。
        3. 错误处理与日志：禁止静默忽略 error（严禁无理由的 `_ = ...`）；后台任务失败时需正确记录并向上传播。
        4. 资源释放与并发：文件句柄、网络连接、互斥锁必须确保 defer 正确释放，防止资源泄露与并发竞争。
    - path: "web/src/**/*.{js,ts,tsx}"
      instructions: |
        React + TypeScript 前端代码审查重点：
        1. 类型安全：优先保持严格的 TypeScript 类型推导，避免滥用 any。
        2. 架构规范：API 请求必须统一通过 `services/api.ts` 导出调用，禁止组件内直接裸调 axios。
        3. Hook 规范：检查 useEffect、useMemo、useCallback 依赖项完整性，防止陈旧闭包与意外死循环。
        4. 交互体验：异步操作必须有完整的 Loading 态与友好的 message/notification 错误兜底。
  tone_instructions: |
    - 请使用规范的简体中文进行代码评审。
    - 评审意见应简洁、专业、直击核心，重点关注安全性、逻辑缺陷、边界情况与数据一致性。
    - 避免提出无关紧要的代码风格或纯格式化争论，优先聚焦高质量工程实践。

chat:
  auto_reply: true
